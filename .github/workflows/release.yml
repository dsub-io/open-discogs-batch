name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prs-created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}

  sign-release-pr:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Import commit signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret: GPG_PRIVATE_KEY"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Sign Release Please commit
        shell: bash
        env:
          EXPECTED_BASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).baseBranchName }}
          RELEASE_PR_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_BASE_BRANCH" != "main" ]]; then
            echo "::error::Release Please pull request does not target main."
            exit 1
          fi
          if [[ ! "$RELEASE_PR_BRANCH" =~ ^release-please--branches--main--components--[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Unexpected Release Please branch."
            exit 1
          fi
          expected_head_sha="$(
            git rev-parse "refs/remotes/origin/$RELEASE_PR_BRANCH"
          )"
          if [[ "$(git rev-parse HEAD)" != "$expected_head_sha" ]]; then
            echo "::error::Checked-out commit does not match Release Please output."
            exit 1
          fi

          signing_key="$(
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ -z "$signing_key" ]]; then
            echo "::error::No GPG secret key is available for commit signing."
            exit 1
          fi

          git config user.name state303
          git config user.email state303@dsub.io
          git config user.signingkey "$signing_key"
          git commit --amend --no-edit --gpg-sign="$signing_key"
          git verify-commit HEAD
          git push \
            --force-with-lease="refs/heads/$RELEASE_PR_BRANCH:$expected_head_sha" \
            origin \
            "HEAD:refs/heads/$RELEASE_PR_BRANCH"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPEN_DISCOGS_TEST_RUN_ID: open-discogs-batch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      TEST_CONTAINER_OWNER_LABEL: io.dsub.test-owner
      TEST_CONTAINER_OWNER: open-discogs-batch
      TEST_CONTAINER_RUN_LABEL: io.dsub.test-run
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Validate Release Please output
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release Please returned an invalid semantic version."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "::error::Release tag does not match the release version."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Checked-out commit does not match the release."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release commit is not on main."
            exit 1
          fi

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test and build release source
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: >-
          ./gradlew clean check e2eTest bootJar
          --no-daemon
          --warning-mode=fail
          -Pversion="$RELEASE_VERSION"

      - name: Remove owned test resources and verify no residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          label_filters=(
            --filter "label=${TEST_CONTAINER_OWNER_LABEL}=${TEST_CONTAINER_OWNER}"
            --filter "label=${TEST_CONTAINER_RUN_LABEL}=${OPEN_DISCOGS_TEST_RUN_ID}"
          )

          container_ids=()
          while IFS= read -r resource_id; do
            [[ -n "$resource_id" ]] && container_ids+=("$resource_id")
          done < <(docker ps -aq "${label_filters[@]}")
          if (( ${#container_ids[@]} > 0 )); then
            docker rm --force --volumes "${container_ids[@]}"
          fi

          network_ids=()
          while IFS= read -r resource_id; do
            [[ -n "$resource_id" ]] && network_ids+=("$resource_id")
          done < <(docker network ls -q "${label_filters[@]}")
          if (( ${#network_ids[@]} > 0 )); then
            docker network rm "${network_ids[@]}"
          fi

          volume_names=()
          while IFS= read -r resource_name; do
            [[ -n "$resource_name" ]] && volume_names+=("$resource_name")
          done < <(docker volume ls -q "${label_filters[@]}")
          if (( ${#volume_names[@]} > 0 )); then
            docker volume rm --force "${volume_names[@]}"
          fi

          container_residue="$(docker ps -aq "${label_filters[@]}")"
          network_residue="$(docker network ls -q "${label_filters[@]}")"
          volume_residue="$(docker volume ls -q "${label_filters[@]}")"
          if [[ -n "$container_residue" || -n "$network_residue" || -n "$volume_residue" ]]; then
            echo "::error::Owned Docker test resources remain after cleanup."
            printf 'containers=%s\nnetworks=%s\nvolumes=%s\n' \
              "$container_residue" "$network_residue" "$volume_residue"
            exit 1
          fi

      - name: Verify and attach executable JAR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          asset="open-discogs-batch-${RELEASE_VERSION}.jar"
          source="build/libs/${asset}"
          reported_version="$(java -jar "$source" --version)"
          if [[ "$reported_version" != "open-discogs-batch $RELEASE_VERSION" ]]; then
            echo "::error::JAR version $reported_version does not match $RELEASE_VERSION."
            exit 1
          fi
          cp "$source" "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          sha256sum --check "${asset}.sha256"
          gh release upload "$RELEASE_TAG" "$asset" "${asset}.sha256" --clobber

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Publish release container
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
          tags: |
            ghcr.io/dsub-io/open-discogs-batch:${{ needs.release-please.outputs.version }}
            ghcr.io/dsub-io/open-discogs-batch:latest
          labels: |
            org.opencontainers.image.source=https://github.com/dsub-io/open-discogs-batch
            org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published architectures
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(
            docker buildx imagetools inspect --raw \
              "ghcr.io/dsub-io/open-discogs-batch@${IMAGE_DIGEST}"
          )"
          jq -e '
            ([
              .manifests[].platform
              | select(
                  .os == "linux" and
                  (.architecture == "amd64" or .architecture == "arm64")
                )
              | (.os + "/" + .architecture)
            ] | unique) == ["linux/amd64", "linux/arm64"]
          ' <<<"$manifest"
