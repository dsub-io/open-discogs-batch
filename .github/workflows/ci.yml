name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  merge_group:
  schedule:
    - cron: '33 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'verification' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'Verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        run: python3 .github/scripts/classify_changes.py

      - name: Test CI routing
        if: steps.changes.outputs.ci == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate workflows and release metadata
        if: steps.changes.outputs.ci == 'true'
        run: bash .github/scripts/check-workflows.sh

      - name: Set up Java
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper
        if: steps.changes.outputs.heavy == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        if: steps.changes.outputs.heavy == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Initialize CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: none

      - name: Verify release policy
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq empty release-please-config.json
          for type in build chore ci docs refactor style test; do
            jq -e \
              --arg type "$type" \
              'any(.["changelog-sections"][]; .type == $type and .hidden == true)' \
              release-please-config.json >/dev/null
          done

      - name: Build, test, and enforce coverage
        if: steps.changes.outputs.heavy == 'true'
        run: ./gradlew clean build --no-daemon --warning-mode=fail

      - name: Analyze with CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin
