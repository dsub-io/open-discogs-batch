name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  merge_group:
  schedule:
    - cron: '33 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'verification' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'Verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        run: python3 .github/scripts/classify_changes.py

      - name: Test CI routing
        if: steps.changes.outputs.ci == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate workflows and release metadata
        if: steps.changes.outputs.ci == 'true'
        run: bash .github/scripts/check-workflows.sh

      - name: Set up Java
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper
        if: steps.changes.outputs.heavy == 'true'
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle
        if: steps.changes.outputs.heavy == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Initialize CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Verify release policy
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq empty release-please-config.json
          for type in build chore ci docs refactor style test; do
            jq -e \
              --arg type "$type" \
              'any(.["changelog-sections"][]; .type == $type and .hidden == true)' \
              release-please-config.json >/dev/null
          done

      - name: Build, test, and enforce coverage
        if: steps.changes.outputs.heavy == 'true'
        run: ./gradlew clean build --no-daemon --warning-mode=fail

      - name: Analyze with CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:java-kotlin
