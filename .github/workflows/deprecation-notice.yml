name: Go migration notices

on:
  push:
    branches: [main]
    paths:
      - '.github/go-migration.json'
      - '.github/scripts/publish_go_notice.py'
      - '.github/workflows/deprecation-notice.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-migration-notices
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dsub-io/open-discogs-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Update repository and release migration links
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 .github/scripts/publish_go_notice.py
