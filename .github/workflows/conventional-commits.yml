name: Conventional Commits

on:
  merge_group:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate pull request title and commit subjects
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?(!)?: .+'

          validate_subject() {
            local label="$1"
            local subject="$2"
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::$label is not a Conventional Commit: $subject"
              return 1
            fi
          }

          failed=0

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            validate_subject "Pull request title" "$PR_TITLE" || failed=1
            normalized_head_ref="${PR_HEAD_REF,,}"
            if [[ "$normalized_head_ref" =~ ^(agent|codex|claude)(/|$) ]]; then
              echo "::error::Forbidden pull request branch name: $PR_HEAD_REF"
              failed=1
            fi
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            range="$MERGE_GROUP_BASE_SHA..$MERGE_GROUP_HEAD_SHA"
          elif [[ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
            git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null &&
            git merge-base --is-ancestor "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"; then
            range="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
          else
            range="$PUSH_HEAD_SHA^..$PUSH_HEAD_SHA"
          fi

          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            validate_subject "Commit subject" "$subject" || failed=1
          done < <(git log --no-merges --format=%s "$range")

          exit "$failed"
